name: Build and sign Sandboxr APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 platforms;android-36 build-tools;36.0.0"

      - name: Install required Android NDK (retry transient download failures)
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          for attempt in 1 2 3; do
            echo "Installing Android NDK $NDK_VERSION (attempt $attempt/3)"
            if sdkmanager --install "ndk;$NDK_VERSION" && test -d "$ANDROID_HOME/ndk/$NDK_VERSION"; then
              echo "NDK $NDK_VERSION installed successfully"
              exit 0
            fi
            echo "NDK installation failed on attempt $attempt; clearing partial SDK downloads"
            rm -rf "$ANDROID_HOME/.downloadIntermediates" "$ANDROID_HOME/.temp" "$ANDROID_HOME/ndk/$NDK_VERSION"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "Unable to install NDK $NDK_VERSION after 3 attempts" >&2
          exit 1

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Generate temporary signing key
        run: |
          keytool -genkeypair -v -keystore sandboxr-release.jks -storepass sandboxr-build -keypass sandboxr-build -alias sandboxr -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Sandboxr Build, O=Sandboxr, C=BR"

      - name: Sign APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$ZIPALIGN" -f 4 "$APK" app-release-aligned.apk
          "$APKSIGNER" sign --ks sandboxr-release.jks --ks-pass pass:sandboxr-build --key-pass pass:sandboxr-build --out Sandboxr-pt-BR-release.apk app-release-aligned.apk
          "$APKSIGNER" verify --verbose Sandboxr-pt-BR-release.apk

      - name: Smoke-test app startup on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          boot-timeout: 900
          disable-animations: true
          script: |
            adb wait-for-device
            adb logcat -c
            adb install -r Sandboxr-pt-BR-release.apk
            adb shell am force-stop com.ujwal.sandboxr
            adb shell am start -W -n com.ujwal.sandboxr/.MainActivity
            sleep 15
            adb logcat -d -b all -v threadtime > startup-logcat.txt
            adb shell dumpsys activity activities > startup-activities.txt
            adb shell pidof com.ujwal.sandboxr > startup-pid.txt || true
            python3 -c "import pathlib,re,sys; s=pathlib.Path('startup-logcat.txt').read_text(errors='ignore'); bad=re.search(r'FATAL EXCEPTION.*?Process: com\\.ujwal\\.sandboxr|Fatal signal.*\\(sandboxr\\)',s,re.S); print('Sandboxr crash signature detected' if bad else 'No Sandboxr crash signature found'); sys.exit(1 if bad else 0)"
            python3 -c "import pathlib,sys; s=pathlib.Path('startup-activities.txt').read_text(errors='ignore'); ok='com.ujwal.sandboxr' in s; print('App activity found' if ok else 'App activity missing'); sys.exit(0 if ok else 1)"
            test -s startup-pid.txt || (echo "Sandboxr process is not running after launch."; exit 1)
            echo "Sandboxr remained running after startup."

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sandboxr-startup-diagnostics
          path: |
            startup-logcat.txt
            startup-activities.txt
            startup-pid.txt
          if-no-files-found: ignore

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Sandboxr-pt-BR-signed
          path: Sandboxr-pt-BR-release.apk
